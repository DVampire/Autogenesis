<div class="task">
<objective>
Generate an environment called `counter_environment` that maintains an integer counter.
</objective>

<requirements>
- Expose two actions: `increment` (adds a given amount, default 1) and `reset` (sets it to 0).
- `get_state` should report the current counter value.
</requirements>
