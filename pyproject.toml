[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autogenesis"
version = "0.1.0"
description = "A self-evolving multi-agent framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Autogenesis" }]

# Core runtime dependencies — the single source of truth (formerly scripts/requirements.txt).
# Imported at package-import time or by the default capability set, so not optional.
# Heavier/rarely-used integrations live in [project.optional-dependencies] below.
dependencies = [
    # core framework
    "mmengine>=0.10.7",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "PyYAML",
    "inflection>=0.5.1",
    "asyncio-atexit>=1.0.1",
    "tenacity>=9.1.4",
    "rich",
    "diskcache>=5.6.3",
    "dirtyjson>=1.0.8",
    "json-repair",
    "jsonschema>=4.20.0",
    "sympy>=1.12.1",
    # http / networking / protocol
    "httpx>=0.28.1",
    "aiohttp>=3.13.3",
    "requests",
    "validators",
    "mcp",
    "crawl4ai>=0.8.6",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # llm providers
    "openai>=1.0.0",
    "anthropic>=0.116.0",
    "google-genai>=2.11.0",
    "google-cloud-vision>=3.13.0",
    "tiktoken>=0.12.0",
    # data / science
    "pandas>=2.0.0",
    "datasets>=2.0.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.2",
    "ipython>=8.0.0",
    # documents / parsing
    "markitdown>=0.1.5",
    "pypdf",
    "pdfminer.six>=20260107",
    "camelot-py>=1.0.9",
    "xlrd>=2.0.2",
    "lxml",
    "defusedxml",
    # secrets
    "hvac>=2.4.0",
]

[project.optional-dependencies]
browser = ["playwright", "browser-use[cli]"]   # browser automation environment
chem = ["rdkit"]                           # chemistry skills (rdkit)
sandbox = ["e2b", "docker", "opensandbox", "opensandbox-server"]  # remote / container sandboxes
benchmark = ["programbench"]               # ProgramBench task/eval data (examples/run_programbench.py)
all = ["playwright", "browser-use[cli]", "rdkit", "e2b", "docker", "programbench", "opensandbox", "opensandbox-server"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
testpaths = ["tests"]
norecursedirs = ["output", "node_modules", ".git", ".venv", "venv"]
markers = [ 
    "integration: requires external credentials, services, browsers, or containers",
]
asyncio_mode = "strict"

[project.scripts]
autogenesis = "autogenesis.cli:main"

[tool.hatch.build.targets.wheel]
# Ship the whole package, including non-Python resources (prompts .html, visual .css/.js,
# bundled skills SKILL.md + scripts). Hatchling includes package data files by default.
packages = ["autogenesis"]

[tool.hatch.build.targets.wheel.force-include]
# Bundle the repo-root default configs into the installed package so they resolve when
# there is no source checkout. In an editable/source install they are still found at the
# repo root first (see autogenesis/paths.py resource search order).
"configs" = "autogenesis/configs"

[tool.hatch.build.targets.sdist]
include = ["autogenesis", "configs", "README.md"]
